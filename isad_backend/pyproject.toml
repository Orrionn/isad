[project]
name = "isad-backend"
version = "0.1.0"
description = "ИСАД: интеллектуальный анализ договоров аренды"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9",
  "python-docx>=1.1,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5,<6",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
